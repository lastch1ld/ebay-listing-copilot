version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # TypeScript 7 is out, and no released typescript-eslint supports it —
    # 8.69.0 and even the canary still declare `peer typescript >=4.8.4
    # <6.1.0`. Because every update lands in one group, that single bump
    # made `npm ci` fail with ERESOLVE and took the other fifteen down with
    # it; CI has been red since 2026-09-01 over a peer range nothing in this
    # repo controls.
    #
    # So TypeScript holds at 5.x until the linter catches up. Remove this
    # once typescript-eslint widens the range — the rest of the group is
    # unaffected and keeps updating monthly.
    ignore:
      - dependency-name: typescript
        versions: [">=6"]
    groups:
      monthly-frontend-updates:
        patterns:
          - "*"
